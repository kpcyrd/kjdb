[package]
name = "kjdb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
async-tempfile = "0.8"
env_logger = { version = "0.11", default-features = false }
libfuzzer-sys = "0.4"
log = "0.4"
rand = { version = "0.10", default-features = false, features = ["alloc", "chacha"] }
serde = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dependencies.kjdb]
path = ".."

[[bin]]
name = "fuzz_db_ops"
path = "fuzz_targets/fuzz_db_ops.rs"
test = false
doc = false
bench = false
