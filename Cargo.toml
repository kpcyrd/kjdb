[package]
name = "kjdb"
version = "0.1.0"
description = "Keyed JSON Database"
authors = ["kpcyrd <git@rxv.cc>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kpcyrd/kjdb"
edition = "2024"

[workspace]
members = ["fuzz"]

[dependencies]
async-stream = "0.3"
fs4 = { version = "1", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }

[dev-dependencies]
async-tempfile = "0.8.0"
tempfile = "3.27.0"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
